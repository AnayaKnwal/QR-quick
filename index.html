<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Quick</title>
  <meta name="google-site-verification" content="n8lvsGZrmEA0GU-XW2-TAFH9uumrga-BXRv5-RtHpCw" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
  
:root{
  --bg:#eef2f7;
  --card:#ffffff;
  --text:#172b4d;
  --muted:#64748b;
  --primary:#123b66;
  --border:#d5deea;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-weight:400;
  line-height:1.5;
}
header{
  text-align:center;
  padding:22px 14px;
  background:#e8edf2;
  border-bottom:1px solid var(--border);
}
header h1{
  margin:0;
  font-size:27px;
  font-weight:500;
  color:#52677d;
}
header p{
  margin:5px 0 0;
  font-size:14px;
  color:var(--muted);
}
main{
  max-width:1000px;
  margin:22px auto;
  padding:0 14px 30px;
}
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}
button{
  border:1px solid transparent;
  border-radius:8px;
  padding:11px 14px;
  background:var(--primary);
  color:#fff;
  font:400 14px Arial,sans-serif;
  cursor:pointer;
}
button:hover{background:#5d7188}
.tab{
  flex:1;
  min-width:85px;
  background:#fff;
  border-color:var(--border);
  color:#657286;
}
.tab.active{
  background:var(--primary);
  color:#fff;
}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  gap:18px;
  align-items:start;
}
.card{
  min-width:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  box-shadow:0 3px 12px rgba(35,45,60,.035);
}
h2{
  margin:0 0 15px;
  font-size:18px;
  font-weight:500;
  color:#526276;
}
label{
  display:block;
  margin:13px 0 6px;
  font-size:13px;
  font-weight:400;
  color:#69778a;
}
input,textarea,select{
  width:100%;
  min-width:0;
  padding:11px;
  border:1px solid #dce1e7;
  border-radius:8px;
  background:#fff;
  color:#465365;
  font:400 14px Arial,sans-serif;
}
input:focus,textarea:focus,select:focus{
  outline:1px solid #9aaabd;
}
textarea{min-height:85px;resize:vertical}
input[type=color]{height:42px;padding:4px}
input[type=file]{font-size:13px;background:#fafbfc}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.note{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}
.hidden{display:none!important}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:17px;
}
.actions button{flex:1}
.secondary{
  background:#eef1f4;
  color:#59697d;
  border-color:var(--border);
}
.secondary:hover{background:#e3e8ed}
#status{
  margin-top:9px;
  font-size:13px;
  color:#6d7b8d;
  overflow-wrap:anywhere;
}
#logoPreview{
  display:none;
  max-width:75px;
  max-height:75px;
  object-fit:contain;
  margin:10px auto;
}
.preview{text-align:center}
#qrWrap{
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  margin:10px auto 15px;
  overflow:hidden;
}
#qrWrap svg{
  display:block;
  width:min(100%,300px);
  height:auto;
  background:white;
}
footer{
  text-align:center;
  padding:0 12px 22px;
  color:#8791a0;
  font-size:12px;
}
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  main{margin-top:15px}
  .card{padding:15px}
  #qrWrap{min-height:220px}
}
</style>
</head>

<body>
<header>
  <h1>QR Quick</h1>
  <p>Create simple QR codes in seconds</p>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-type="url">URL / Text</button>
    <button class="tab" data-type="wifi">Wi-Fi</button>
    <button class="tab" data-type="contact">Contact</button>
  </div>

  <div class="layout">
    <section class="card">
      <h2>QR Code Settings</h2>

      <div id="urlFields">
        <label for="qrText">Website URL or Text</label>
        <textarea id="qrText" placeholder="https://example.com"></textarea>
      </div>

      <div id="wifiFields" class="hidden">
        <label for="wifiName">Wi-Fi Network Name</label>
        <input id="wifiName" placeholder="Wi-Fi name">
        <label for="wifiPassword">Wi-Fi Password</label>
        <input id="wifiPassword" type="password" placeholder="Password">
        <label for="wifiSecurity">Security</label>
        <select id="wifiSecurity">
          <option value="WPA">WPA/WPA2</option>
          <option value="WEP">WEP</option>
          <option value="nopass">No Password</option>
        </select>
      </div>

      <div id="contactFields" class="hidden">
        <label for="contactName">Full Name</label>
        <input id="contactName" placeholder="Your name">
        <label for="contactPhone">Phone Number</label>
        <input id="contactPhone" type="tel" placeholder="+92...">
        <label for="contactEmail">Email</label>
        <input id="contactEmail" type="email" placeholder="you@example.com">
        <label for="contactOrg">Organization</label>
        <input id="contactOrg" placeholder="Organization (optional)">
      </div>

      <div class="row">
        <div>
          <label for="qrColor">QR Color</label>
          <input id="qrColor" type="color" value="#263445">
        </div>
        <div>
          <label for="bgColor">Background Color</label>
          <input id="bgColor" type="color" value="#ffffff">
        </div>
      </div>

      <label for="logoFile">Upload Logo (optional)</label>
      <input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp">
      <p class="note">Choose a PNG, JPG, or WEBP image under 5 MB.</p>
      <img id="logoPreview" alt="Logo preview">
      <div id="status" role="status" aria-live="polite">Select a logo to place it in the center.</div>

      <div class="actions">
        <button id="generateBtn" type="button">Generate QR Code</button>
        <button id="removeLogoBtn" class="secondary" type="button">Remove Logo</button>
      </div>
    </section>

    <section class="card preview">
      <h2>Your QR Code</h2>
      <div id="qrWrap"></div>
      <p class="note">Scan your QR code with a phone camera to test it.</p>
      <div class="actions">
        <button id="pngBtn" type="button">Download PNG</button>
        <button id="svgBtn" class="secondary" type="button">Download SVG</button>
      </div>
    </section>
  </div>
</main>

<footer>QR Quick · Simple QR code generator</footer>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  let type="url";
  let logoData="";
  let currentSvg="";

  function esc(s){
    return String(s).replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"
    })[c]);
  }

  function getText(){
    if(type==="wifi"){
      const name=$("wifiName").value.trim();
      const pass=$("wifiPassword").value;
      const security=$("wifiSecurity").value;
      if(!name)throw Error("Enter your Wi-Fi network name.");
      const safe=s=>String(s).replace(/([\\;,:"])/g,"\\$1");
      return "WIFI:T:"+security+";S:"+safe(name)+";"+
        (security==="nopass"?"":"P:"+safe(pass)+";")+";";
    }

    if(type==="contact"){
      const name=$("contactName").value.trim();
      const phone=$("contactPhone").value.trim();
      const email=$("contactEmail").value.trim();
      const org=$("contactOrg").value.trim();
      if(!name&&!phone&&!email)throw Error("Enter a name, phone, or email.");
      const safe=s=>String(s).replace(/([\\;,])/g,"\\$1");
      return "BEGIN:VCARD\nVERSION:3.0\n"+
        "N:"+safe(name)+"\nFN:"+safe(name)+"\n"+
        (phone?"TEL:"+safe(phone)+"\n":"")+
        (email?"EMAIL:"+safe(email)+"\n":"")+
        (org?"ORG:"+safe(org)+"\n":"")+
        "END:VCARD";
    }

    const value=$("qrText").value.trim();
    if(!value)throw Error("Enter a URL or text first.");
    return value;
  }

  function buildSvg(){
    const qr=qrcode(0,"H");
    qr.addData(getText());
    qr.make();

    const n=qr.getModuleCount();
    const quiet=4;
    const total=n+quiet*2;
    const fg=$("qrColor").value;
    const bg=$("bgColor").value;
    let path="";

    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(qr.isDark(r,c)){
          path+="M"+(c+quiet)+" "+(r+quiet)+"h1v1h-1z";
        }
      }
    }

    let svg='<svg xmlns="http://www.w3.org/2000/svg" '+
      'xmlns:xlink="http://www.w3.org/1999/xlink" '+
      'width="'+total+'" height="'+total+'" viewBox="0 0 '+
      total+' '+total+'">'+
      '<rect width="100%" height="100%" fill="'+esc(bg)+'"/>'+
      '<path fill="'+esc(fg)+'" shape-rendering="crispEdges" d="'+path+'"/>';

    if(logoData){
      const size=total*0.17;
      const x=(total-size)/2;
      const y=(total-size)/2;
      const pad=total*0.025;
      svg+='<rect x="'+(x-pad)+'" y="'+(y-pad)+
        '" width="'+(size+pad*2)+'" height="'+(size+pad*2)+
        '" fill="'+esc(bg)+'"/>'+
        '<image x="'+x+'" y="'+y+'" width="'+size+
        '" height="'+size+'" preserveAspectRatio="xMidYMid meet" '+
        'href="'+esc(logoData)+'" xlink:href="'+esc(logoData)+'"/>';
    }

    return svg+"</svg>";
  }

  function render(){
    try{
      if(typeof qrcode!=="function"){
        throw Error("QR library could not load. Check your internet and reload.");
      }
      currentSvg=buildSvg();
      $("qrWrap").innerHTML=currentSvg;
      $("status").textContent=logoData?
        "Logo loaded and added to the QR code.":"QR code ready.";
    }catch(e){
      currentSvg="";
      $("qrWrap").innerHTML="";
      $("status").textContent=e.message||"Could not generate QR code.";
    }
  }

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      type=btn.dataset.type;
      document.querySelectorAll(".tab").forEach(b=>
        b.classList.toggle("active",b===btn));
      $("urlFields").classList.toggle("hidden",type!=="url");
      $("wifiFields").classList.toggle("hidden",type!=="wifi");
      $("contactFields").classList.toggle("hidden",type!=="contact");
      render();
    });
  });

  $("logoFile").addEventListener("change",event=>{
    const file=event.target.files&&event.target.files[0];
    if(!file){
      $("status").textContent="No file selected.";
      return;
    }
    if(!["image/png","image/jpeg","image/webp"].includes(file.type)){
      $("status").textContent="Choose a PNG, JPG, or WEBP image.";
      event.target.value="";
      return;
    }
    if(file.size>5*1024*1024){
      $("status").textContent="Image is too large. Choose a file under 5 MB.";
      event.target.value="";
      return;
    }

    $("status").textContent="Loading logo...";
    const reader=new FileReader();
    reader.onload=()=>{
      if(typeof reader.result!=="string"){
        $("status").textContent="Could not read the image. Try again.";
        return;
      }
      logoData=reader.result;
      $("logoPreview").src=logoData;
      $("logoPreview").style.display="block";
      render();
    };
    reader.onerror=()=>{
      $("status").textContent="Logo upload failed. Select the image again.";
    };
    reader.readAsDataURL(file);
  });

  $("removeLogoBtn").addEventListener("click",()=>{
    logoData="";
    $("logoFile").value="";
    $("logoPreview").removeAttribute("src");
    $("logoPreview").style.display="none";
    render();
  });

  $("generateBtn").addEventListener("click",render);

  ["qrText","wifiName","wifiPassword","wifiSecurity",
   "contactName","contactPhone","contactEmail","contactOrg",
   "qrColor","bgColor"].forEach(id=>{
    $(id).addEventListener("input",render);
    $(id).addEventListener("change",render);
  });

  function download(blob,name){
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }

  $("svgBtn").addEventListener("click",()=>{
    render();
    if(currentSvg){
      download(new Blob([currentSvg],{type:"image/svg+xml;charset=utf-8"}),"qr-quick.svg");
    }
  });

  $("pngBtn").addEventListener("click",()=>{
    render();
    if(!currentSvg)return;

    const blob=new Blob([currentSvg],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const img=new Image();

    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const scale=12;
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      const ctx=canvas.getContext("2d");
      ctx.imageSmoothingEnabled=false;
      ctx.fillStyle=$("bgColor").value;
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(file=>{
        if(file)download(file,"qr-quick.png");
        else $("status").textContent="PNG download failed. Try SVG.";
      },"image/png");
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      $("status").textContent="PNG failed. Please try SVG download.";
    };
    img.src=url;
  });

  render();
})();
</script>
</body>
</html>
